# Sign in through the system's authentication sheet, then sign out (OpenSpec change
# native-app-foundation, task 4.4; account-access "App sign-in through the system
# browser"). Against a server with an account: maestro/run.sh starts one. The sheet shares
# the browser's cookies, so a run that finds a session only confirms. Nothing of the web
# app's own may cover the confirmation: a fresh owner's welcome note and start guide wait.
appId: app.open-todo.ios
---
- runFlow: common/sign-in.yaml
- tapOn: Sign out
- assertVisible: Your server
