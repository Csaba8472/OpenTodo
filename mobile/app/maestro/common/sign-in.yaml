# Signs in through the system's authentication sheet (design D5) and waits for Today, or
# Unlock on an encrypted account: the address, the sheet, the password when the sheet has
# no session, the confirmation. Run from the flows in the folder above with SERVER, EMAIL
# and PASSWORD.
appId: ${APP_ID}
---
# Stopped first, then cleared, then launched: on Android, clearing a running app made the
# system start it again at the same moment as the launch, and it came up 18 s late.
- stopApp
- clearState
- clearKeychain
- launchApp
- tapOn: Server address
- inputText: ${SERVER}
- tapOn: Continue
# iOS asks before the sheet opens: "“OpenTodo” Wants to Use “…” to Sign In".
- tapOn:
    text: Continue
    index: 0
    optional: true
- extendedWaitUntil:
    visible: Password|Sign in to the OpenTodo app on (iPhone|Android)\?
    timeout: 40000
# A sheet that kept an older web app offers its update over the form (Safari's cache
# outlives a test server): take it, then the form again.
- runFlow:
    when:
      visible: Reload to update
    commands:
      - tapOn: Reload to update
      - extendedWaitUntil:
          visible: Password|Sign in to the OpenTodo app on (iPhone|Android)\?
          timeout: 40000
- runFlow:
    when:
      visible: Password
    commands:
      - tapOn:
          text: Email
          index: -1
      - inputText: ${EMAIL}
      - tapOn: Password
      - inputText: ${PASSWORD}
      - tapOn:
          text: Sign in
          index: -1
      # The system offers to keep the password, sometimes only after the confirmation is up.
      - extendedWaitUntil:
          visible: Not Now|Sign in to the OpenTodo app on (iPhone|Android)\?
          timeout: 40000
      - runFlow:
          file: not-now.yaml
- extendedWaitUntil:
    visible: Sign in to the OpenTodo app on (iPhone|Android)\?
    timeout: 40000
- runFlow:
    file: not-now.yaml
- tapOn:
    text: Sign in
    index: -1
- extendedWaitUntil:
    visible: Today|Unlock
    timeout: 40000

# The native publisher asks after the first debounced snapshot. Settle that system
# permission before a test backgrounds the app or opens another app's share sheet.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: { text: Allow, optional: true }
