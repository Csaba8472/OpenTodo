# Sync and Today (native-app-foundation 4.5, 4.6; native-app-everyday 2.2): a task made on
# the server shows in Today; renamed on the server while the app is open, it changes
# without a tap (the live stream); a full swipe right completes it with Undo in the
# toast; Undo reopens it, and the server never keeps the completion; completed again, the
# server has it completed.
appId: ${APP_ID}
---
- runScript:
    file: scripts/create-task.js
    env:
      TITLE: Buy milk
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
    visible: Buy milk
    timeout: 20000
- runScript:
    file: scripts/rename-task.js
    env:
      TITLE: Buy oat milk
- extendedWaitUntil:
    visible: Buy oat milk
    timeout: 10000
- swipe:
    from:
      text: Buy oat milk
    direction: RIGHT
- tapOn: Undo
- extendedWaitUntil:
    visible: Buy oat milk
    timeout: 5000
- runScript:
    file: scripts/check-task.js
    env:
      CHECK: t.completed_at === null
- swipe:
    from:
      text: Buy oat milk
    direction: RIGHT
- extendedWaitUntil:
    notVisible: Buy oat milk
    timeout: 8000
- runScript: scripts/completed-on-server.js
- runFlow: common/sign-out.yaml
